{% extends "base.html" %} {% block content %}

<h2 class="mb-4">Uredi plan</h2>

<div class="card shadow p-4">
  <form method="POST">
    <div class="mb-3">
      <label>Naziv</label>
      <input
        type="text"
        name="naziv"
        class="form-control"
        value="{{ plan.naziv }}"
      />
    </div>

    <div class="mb-3">
      <label>Broj vježbi</label>
      <input
        type="number"
        name="broj"
        class="form-control"
        value="{{ plan.broj_vjezba }}"
      />
    </div>

    <div class="mb-3">
      <label>Opis</label>
      <textarea name="opis" class="form-control" rows="4">
{{ plan.opis_vjezba }}</textarea
      >
    </div>

    <div class="mb-3">
      <label>Trajanje</label>
      <input
        type="number"
        name="trajanje"
        class="form-control"
        value="{{ plan.trajanje }}"
      />
    </div>

    <div class="row">
      <div class="col">
        <label>Kalorije</label>
        <input
          type="number"
          name="kalorije"
          class="form-control"
          value="{{ plan.kalorije }}"
        />
      </div>

      <div class="col">
        <label>Proteini</label>
        <input
          type="number"
          name="proteini"
          class="form-control"
          value="{{ plan.proteini }}"
        />
      </div>
    </div>

    <div class="row mt-3">
      <div class="col">
        <label>Masti</label>
        <input
          type="number"
          name="masti"
          class="form-control"
          value="{{ plan.masti }}"
        />
      </div>

      <div class="col">
        <label>UH</label>
        <input
          type="number"
          name="uh"
          class="form-control"
          value="{{ plan.ugljikohidrati }}"
        />
      </div>
    </div>

    <button class="btn btn-primary mt-4 w-100">Spremi promjene</button>

    <a href="/planovi" class="btn btn-outline-secondary w-100 mt-2">
      Izađi bez spremanja
    </a>
  </form>
</div>

{% endblock %}
